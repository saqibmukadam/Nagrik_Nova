<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Nagrik Nova</title>
    
    <!-- 🌍 GOOGLE TRANSLATE CSS OVERRIDES -->
    <style>
      .goog-te-banner-frame.skiptranslate, 
      .goog-te-banner-frame,
      .VIpgJd-Zvi9od-aZ2wEe-wOHMyf,
      .VIpgJd-Zvi9od-aZ2wEe-wOHMyf-ti6hGc { 
        display: none !important; 
        opacity: 0 !important;
        visibility: hidden !important;
        height: 0 !important;
      }
      html, body { 
        top: 0px !important; 
        position: static !important; 
      }
      #goog-gt-tt, .goog-te-balloon-frame { 
        display: none !important; 
      }
      .goog-text-highlight { 
        background: none !important; 
        box-shadow: none !important; 
        border: none !important; 
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Hidden Google Translate Engine -->
    <div id="google_translate_element" style="display: none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'en',
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    
    <!-- 🛑 THE TERMINATOR SCRIPT: Instantly deletes the banner from the DOM -->
    <script>
      const observer = new MutationObserver(() => {
        // Find Google's injected banner elements and completely remove them
        const banners = document.querySelectorAll('.goog-te-banner-frame, .VIpgJd-Zvi9od-aZ2wEe-wOHMyf');
        banners.forEach(banner => banner.remove());
        
        // Strip the forced 40px gap from the body/html
        if (document.body && document.body.style.top !== '0px') {
          document.body.style.setProperty('top', '0px', 'important');
          document.body.style.setProperty('position', 'static', 'important');
        }
        if (document.documentElement && document.documentElement.style.top !== '0px') {
          document.documentElement.style.setProperty('top', '0px', 'important');
        }
      });
      
      // Watch the entire document for Google's sneaky injections
      observer.observe(document.documentElement, { 
        childList: true, 
        subtree: true, 
        attributes: true, 
        attributeFilter: ['style'] 
      });
    </script>
  </body>
</html>
